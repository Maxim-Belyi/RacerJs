<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.scss">
    <title>Car game</title>
</head>

<body>
    <div class="container">
            <div class="backdrop shop-modal" data-js-shop-modal>
                <div class="shop-modal__wrapper">
                    <div class="shop-modal__header">
                        <h2 class="shop-modal__title">Магазин</h2>
                        <div class="shop-modal__tabs">
                            <button class="shop-modal__tab active" data-js-shop-tab="garage">Гараж</button>
                            <button class="shop-modal__tab" data-js-shop-tab="upgrades">Улучшения</button>
                        </div>
                        <div class="shop-modal__coins">🪙 <span data-js-shop-coins>0</span></div>
                        <button class="shop-modal__close" type="button" data-js-close-shop>&times;</button>
                    </div>
                    <div class="shop-modal__content" data-js-shop-content>
                    </div>
                </div>
            </div>
        <div class="road" data-js-road>
            <div class="road-marking" data-js-road-marking></div>
            <div class="start-line" data-js-start-line></div>
            <div class="finish-line" data-js-finish-line></div>

            <div class="backdrop end-game" data-js-end-game-backdrop>
                <div class="end-game__wrapper">
                    <div class="end-game__text">
                        <p>Total score: <span class="end-game__score" data-js-end-game-score>0</span></p>
                    </div>
                    <button class="button end-game__button" type="button" data-js-end-game-button>Restart</button>
                    <button class="button end-game__button" style="background: #e67e22;" type="button" data-js-open-shop>🛒 Shop</button>
                </div>
            </div>

            <div class="backdrop welcome-screen" data-js-welcome-screen>
                <div class="welcome-screen__wrapper">
                    <h1 class="welcome-screen__title">Racer JS</h1>
                    <div class="welcome-screen__mechanics">
                        <div class="mechanic">
                            <img src="./images/coin.png" alt="Coin">
                            <span>Собирай монеты</span>
                        </div>
                        <div class="mechanic">
                            <img src="./images/arrow.png" alt="Boost">
                            <span>Ускорение (Boost)</span>
                        </div>
                        <div class="mechanic">
                            <img src="./images/danger.png" alt="Danger">
                            <span>Избегай аварий</span>
                        </div>
                    </div>
                    <div class="welcome-screen__actions">
                        <button class="button welcome-screen__button" type="button" data-js-start-game>Начать игру </button>
                        <button class="button welcome-screen__button" style="background: #e67e22;" type="button" data-js-open-shop>🛒 Магазин</button>
                    </div>
                </div>
            </div>

           
        </div>

        <div class="car car__blue" data-js-car>
            <img src="./images/car.png" alt="">
            <img src="./images/magnet.svg" class="car-magnet-indicator" data-js-car-magnet style="display: none;">
        </div>

        <div class="car car__ai car__ai--1" data-js-ai-car>
            <img src="./images/car.png" alt="">
        </div>
        <div class="car car__ai car__ai--2" data-js-ai-car>
            <img src="./images/car.png" alt="">
        </div>

        <div class="tree tree-1" data-js-tree>
            <img src="./images/tree1.png" alt="">
        </div>

        <div class="tree tree-2" data-js-tree>
            <img src="./images/tree2.png" alt="">
        </div>

        <div class="tree tree-3" data-js-tree>
            <img src="./images/tree3.png" alt="">
        </div>

        <div class="tree tree-4" data-js-tree>
            <img src="./images/tree2.png" alt="">
        </div>

        <div class="tree tree-5" data-js-tree>
            <img src="./images/tree1.png" alt="">
        </div>

        <div class="tree tree-6" data-js-tree>
            <img src="./images/tree3.png" alt="">
        </div>

        <div class="tree tree-7" data-js-tree>
            <img src="./images/decorations/objects_3.png" alt="">
        </div>

        <div class="tree tree-8" data-js-tree>
            <img src="./images/decorations/objects_2.png" alt="">
        </div>

        <div class="tree tree-9" data-js-tree>
            <img src="./images/decorations/objects_5.png" alt="">
        </div>

        <div class="tree tree-10" data-js-tree>
            <img src="./images/decorations/objects_6.png" alt="">
        </div>

        <div class="tree tree-11" data-js-tree>
            <img src="./images/decorations/objects_7.png" alt="">
        </div>

        <div class="tree tree-12" data-js-tree>
            <img src="./images/decorations/nature_16.png" alt="">
        </div>

        <div class="signs signs__crack" data-js-crack>
            <img src="./images/decorations/cracks_1.png" alt="">
        </div>
        <div class="signs signs__crack" data-js-crack>
            <img src="./images/decorations/cracks_2.png" alt="">
        </div>
        <div class="signs signs__crack" data-js-crack>
            <img src="./images/decorations/cracks_3.png" alt="">
        </div>
        <div class="signs signs__crack" data-js-crack>
            <img src="./images/decorations/cracks_4.png" alt="">
        </div>

        <div class="signs signs__arrow arrow" data-js-arrow>
            <img src="./images/arrow.png" alt="">
        </div>

        <div class="signs signs__danger danger" data-js-danger>
            <img src="./images/danger.png" alt="">
        </div>

        <div class="signs signs__coin coin" data-js-coin>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__coin-alt coin-alt" data-js-coin-alt>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__coin coin-b" data-js-coin-b>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__coin-alt coin-c" data-js-coin-c>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__coin" data-js-coin-d>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__coin-alt" data-js-coin-e>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__coin" data-js-coin-f>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__coin-alt" data-js-coin-g>
            <img src="./images/coin.png" alt="">
        </div>

        <div class="signs signs__arrow arrow-b" data-js-arrow-b>
            <img src="./images/arrow.png" alt="">
        </div>

        <div class="signs signs__magnet magnet" data-js-magnet>
            <img src="./images/magnet.svg" alt="">
        </div>

        <div class="countdown" data-js-countdown></div>

        <div class="race-result" data-js-crash-modal>
            <div class="race-result__inner">
                <h2 class="race-result__title" style="color: #e74c3c;">💥 Авария!</h2>
                <p style="text-align: center; margin-bottom: 5px; font-size: 1.2rem; color: rgba(255, 255, 255, 0.8);">Вы врезались в препятствие!</p>
                <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                    <button class="race-result__btn race-result__btn--green" type="button" data-js-crash-revive>
                        ❤️ Возродиться (Осталось: <span data-js-crash-lives>0</span>)
                    </button>
                    <div style="display: flex; gap: 12px; width: 100%;">
                        <button class="race-result__btn race-result__btn--red" type="button" data-js-crash-restart style="flex: 1;">Начать заново</button>
                        <button class="race-result__btn race-result__btn--orange" type="button" data-js-open-shop style="flex: 1;">🛒 Магазин</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="race-result" data-js-race-result>
            <div class="race-result__inner">
                <h2 class="race-result__title">🏁 Финиш !</h2>
                <ul class="race-result__list" data-js-result-list></ul>
                <div style="display: flex; gap: 12px; margin-top: 20px; width: 100%;">
                    <button class="race-result__btn" type="button" data-js-restart>Сыграть снова</button>
                    <button class="race-result__btn race-result__btn--orange" type="button" data-js-open-shop>🛒 Магазин</button>
                </div>
            </div>
        </div>

        <div class="game-score" data-js-game-score-wrapper>
            <p class="game-score__title">Ваш счёт:</p>
            <p class="game-score__value" data-js-game-score-value>0</p>
        </div>

        <div class="button-wrapper">
            <!-- <button class="button button__game" type="button" data-js-start-game-button>
                <img class="button__pause" src="./images/pause.png" alt="">
                <img class="button__play visually-hidden" src="./images/play.png" alt="">
            </button> -->

            <button class="button__sound button" data-js-sound-button>
                <img class="button__sound-on" src="./images/sound-on.png"></img>
                <img class="button__sound-off visually-hidden" src="./images/sound-off.png"></img>
            </button>
        </div>

        <div class="button-controls-wrapper__left">
            <button class="button-controls__left button" data-js-left-control>
                <img src="./images/arrow-button.avif" alt="" width="48" height="48">
            </button>

            <button class="button-controls__down button" data-js-down-control>
                <img src="./images/arrow-button.avif" alt="" width="48" height="48">
            </button>
        </div>

        <div class="button-controls-wrapper__right">
            <button class="button-controls__top button" data-js-top-control>
                <img src="./images/arrow-button.avif" alt=""  width="48" height="48">
            </button>

            <button class="button-controls__right button" data-js-right-control>
                <img src="./images/arrow-button.avif" alt=""  width="48" height="48">
            </button>
        </div>

    </div>
</body>

<script type="module" src="js/game.js"></script>
</html>
